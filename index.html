<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İyi Ki Doğdun Sudiş! ✨</title>
  
  <!-- Sleek Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* ==========================================
       1. GLOBAL RESET & STYLE SYSTEM
       ========================================== */
    :root {
      --bg-dark: #02000c;
      --bg-card: rgba(255, 255, 255, 0.02);
      --border-card: rgba(255, 255, 255, 0.05);
      --neon-blue: #00f0ff;
      --neon-blue-glow: 0 0 15px rgba(0, 240, 255, 0.6), 0 0 30px rgba(0, 240, 255, 0.3);
      --neon-blue-text: 0 0 8px rgba(0, 240, 255, 0.5), 0 0 20px rgba(0, 240, 255, 0.2);
      --fb-yellow: #ffe600;
      --fb-navy: #001c55;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* Custom Premium Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-dark);
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #050b24 0%, var(--neon-blue) 100%);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--neon-blue);
      box-shadow: var(--neon-blue-glow);
    }

    /* ==========================================
       2. INTERACTIVE GLOWING CURSOR
       ========================================== */
    .custom-cursor {
      width: 8px;
      height: 8px;
      background-color: var(--neon-blue);
      border-radius: 50%;
      position: fixed;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 9999;
      box-shadow: 0 0 10px var(--neon-blue);
      transition: width 0.2s, height 0.2s, background-color 0.2s;
    }

    .custom-cursor-follower {
      width: 40px;
      height: 40px;
      border: 2px solid rgba(0, 240, 255, 0.4);
      border-radius: 50%;
      position: fixed;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 9998;
      transition: transform 0.08s ease-out, border-color 0.2s, width 0.2s, height 0.2s;
    }

    @media (max-width: 768px) {
      .custom-cursor, .custom-cursor-follower {
        display: none !important;
      }
    }

    /* ==========================================
       3. BACKGROUND GLOWING ORBS
       ========================================== */
    .bg-glows {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(130px);
      opacity: 0.12;
      transition: all 2s ease;
    }

    .orb-1 {
      top: 10%;
      left: 15%;
      width: 450px;
      height: 450px;
      background: var(--neon-blue);
      animation: orb-move-1 25s infinite alternate ease-in-out;
    }

    .orb-2 {
      bottom: 15%;
      right: 10%;
      width: 550px;
      height: 550px;
      background: #0066ff;
      animation: orb-move-2 30s infinite alternate ease-in-out;
    }

    .orb-3 {
      top: 50%;
      left: 60%;
      width: 350px;
      height: 350px;
      background: #c300ff;
      opacity: 0.06;
      animation: orb-move-3 20s infinite alternate ease-in-out;
    }

    @keyframes orb-move-1 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(120px, 90px) scale(1.15); }
      100% { transform: translate(-40px, 150px) scale(0.9); }
    }
    @keyframes orb-move-2 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-100px, -90px) scale(0.85); }
      100% { transform: translate(60px, -130px) scale(1.1); }
    }
    @keyframes orb-move-3 {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-60px, 80px); }
    }

    /* ==========================================
       4. NAVIGATION SCROLL DOTS (10 DOTS)
       ========================================== */
    .scroll-nav {
      position: fixed;
      right: 25px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 100;
    }

    .nav-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(0, 240, 255, 0.15);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .nav-dot:hover {
      background: rgba(0, 240, 255, 0.6);
      transform: scale(1.3);
    }

    .nav-dot.active {
      background: var(--neon-blue);
      box-shadow: var(--neon-blue-glow);
      transform: scale(1.5);
    }

    /* ==========================================
       5. GENERAL SECTION LAYOUT
       ========================================== */
    .section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: 5rem 2rem;
      box-sizing: border-box;
      z-index: 2;
    }

    /* ==========================================
       6. SECTION 1: HERO (GİRİŞ)
       ========================================== */
    .hero-section {
      background: linear-gradient(180deg, rgba(2, 0, 12, 0.5) 0%, rgba(5, 11, 36, 0.3) 100%);
    }

    .hero-container {
      text-align: center;
      max-width: 800px;
      z-index: 10;
    }

    .floating-element {
      animation: float 6s ease-in-out infinite;
    }

    .hero-title {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, #ffffff 40%, var(--neon-blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(0, 240, 255, 0.1);
      font-family: 'Outfit', sans-serif;
    }

    .hero-subtitle {
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      color: #8892b0;
      margin-bottom: 3rem;
      font-weight: 400;
      line-height: 1.6;
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    /* Scroll Down Indicator */
    .scroll-down {
      position: absolute;
      bottom: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: #8892b0;
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.3s;
      animation: bounce 2s infinite;
    }

    .scroll-down:hover {
      color: var(--neon-blue);
      text-shadow: var(--neon-blue-text);
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
      60% { transform: translateY(-5px); }
    }

    /* ==========================================
       7. SECTION 2: DOĞUM GÜNÜ & SPOTIFY
       ========================================== */
    .spotify-section {
      background: linear-gradient(180deg, rgba(5, 11, 36, 0.3) 0%, rgba(2, 0, 12, 0.4) 100%);
    }

    .zoom-in-container {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 4rem;
      max-width: 1100px;
      width: 100%;
      align-items: center;
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .spotify-section.active .zoom-in-container {
      opacity: 1;
      transform: scale(1);
    }

    @media (max-width: 900px) {
      .zoom-in-container {
        grid-template-columns: 1fr;
        gap: 2.5rem;
      }
    }

    .letter-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-top: 3px solid var(--neon-blue);
      backdrop-filter: blur(15px);
      padding: 3rem;
      border-radius: 24px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.01);
    }

    .card-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.15);
      color: var(--neon-blue);
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      text-shadow: var(--neon-blue-text);
    }

    .letter-card h2 {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, #ffffff 40%, var(--neon-blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }

    .letter-card p {
      font-size: 1.1rem;
      line-height: 1.8;
      color: #ccd6f6;
    }

    .spotify-card {
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: transform 0.3s;
    }

    .spotify-card:hover {
      transform: translateY(-5px);
    }

    .spotify-card iframe {
      display: block;
    }

    /* ==========================================
       8. SECTION 3: ZAMAN TÜNELİ SAYAÇ
       ========================================== */
    .counter-section {
      background: linear-gradient(180deg, rgba(2, 0, 12, 0.4) 0%, rgba(5, 11, 36, 0.3) 100%);
    }

    .spin-container {
      max-width: 900px;
      width: 100%;
      text-align: center;
      background: rgba(2, 0, 16, 0.6);
      border: 1px solid rgba(0, 240, 255, 0.08);
      backdrop-filter: blur(15px);
      border-radius: 32px;
      padding: 4rem 3rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: perspective(1000px) rotateY(-180deg) rotateX(15deg) scale(0.85);
      transition: opacity 1.3s cubic-bezier(0.16, 1, 0.3, 1), transform 1.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .counter-section.active .spin-container {
      opacity: 1;
      transform: perspective(1000px) rotateY(0deg) rotateX(0deg) scale(1);
    }

    .counter-header h2 {
      font-size: clamp(2rem, 5vw, 2.8rem);
      margin-bottom: 3rem;
      background: linear-gradient(135deg, #ffffff 40%, var(--neon-blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .counter-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
    }

    @media (max-width: 600px) {
      .counter-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
      }
    }

    .counter-box {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 2rem 1rem;
      box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.02);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .counter-box::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 10%;
      width: 80%;
      height: 2px;
      background: var(--neon-blue);
      box-shadow: 0 0 10px var(--neon-blue);
      opacity: 0.2;
      transition: opacity 0.3s;
    }

    .counter-box:hover {
      transform: translateY(-5px);
      border-color: rgba(0, 240, 255, 0.25);
    }

    .counter-box:hover::after {
      opacity: 0.8;
    }

    .counter-num {
      display: block;
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 800;
      color: var(--neon-blue);
      text-shadow: var(--neon-blue-glow);
      margin-bottom: 0.5rem;
    }

    .counter-label {
      font-size: 0.8rem;
      letter-spacing: 2px;
      color: #8892b0;
      font-weight: 600;
    }

    /* ==========================================
       9. SECTION 4: İLK GÜNÜN ANISI (CHAT LOG)
       ========================================== */
    .chat-section {
      background: linear-gradient(180deg, rgba(2, 0, 12, 0.4) 0%, rgba(5, 11, 36, 0.3) 100%);
    }

    .chat-wrapper {
      max-width: 700px;
      width: 100%;
      margin: 0 auto;
    }

    .chat-container {
      background: rgba(2, 0, 16, 0.7);
      border: 1px solid rgba(0, 240, 255, 0.15);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(15px);
    }

    .chat-header {
      background: rgba(0, 240, 255, 0.05);
      border-bottom: 1px solid rgba(0, 240, 255, 0.1);
      padding: 1rem 1.5rem;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--neon-blue);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px #22c55e;
    }

    .chat-messages {
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .chat-bubble {
      max-width: 85%;
      padding: 1.2rem 1.5rem;
      border-radius: 20px;
      line-height: 1.6;
      position: relative;
      font-size: 1.05rem;
    }

    .chat-left {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom-left-radius: 4px;
      color: #e2e8f0;
      opacity: 0;
      transform: translateX(-100px);
    }

    .chat-right {
      align-self: flex-end;
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-bottom-right-radius: 4px;
      color: #ffffff;
      box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.03);
      opacity: 0;
      transform: translate(100px, -100px);
    }

    .chat-sender {
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .chat-left .chat-sender {
      color: #ffe600;
    }

    .chat-right .chat-sender {
      color: var(--neon-blue);
      text-shadow: var(--neon-blue-text);
    }

    /* Animations Trigger */
    .chat-section.active .chat-left {
      animation: chatSlideLeft 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    .chat-section.active .chat-right {
      animation: chatDropRight 0.8s cubic-bezier(0.25, 1, 0.5, 1) 0.5s forwards;
    }

    @keyframes chatSlideLeft {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes chatDropRight {
      to {
        opacity: 1;
        transform: translate(0, 0);
      }
    }

    /* ==========================================
       10. SECTION 5: DİJİTAL YEMEK DATE'İ
       ========================================== */
    .food-section {
      background: linear-gradient(180deg, rgba(5, 11, 36, 0.3) 0%, rgba(2, 0, 12, 0.4) 100%);
    }

    .food-container {
      max-width: 1000px;
      width: 100%;
      text-align: center;
    }

    .table-container {
      background: rgba(2, 0, 16, 0.45);
      border: 1px solid rgba(0, 240, 255, 0.05);
      border-radius: 32px;
      padding: 5rem 3rem 4rem 3rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .picnic-table {
      display: flex;
      justify-content: center;
      gap: 6rem;
      position: relative;
      align-items: flex-end;
    }

    @media (max-width: 768px) {
      .picnic-table {
        flex-direction: column;
        align-items: center;
        gap: 5rem;
      }
      .table-container {
        padding: 4rem 1.5rem;
      }
    }

    .table-container::after {
      content: '';
      position: absolute;
      bottom: 75px;
      left: 5%;
      width: 90%;
      height: 12px;
      background: linear-gradient(90deg, #101935 0%, #030018 50%, #101935 100%);
      border-radius: 10px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 240, 255, 0.15);
      border: 1px solid rgba(0, 240, 255, 0.1);
    }

    @media (max-width: 768px) {
      .table-container::after {
        display: none;
      }
    }

    /* Gravity Bounce scroll animation initial states */
    .gravity-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 5;
      opacity: 0;
      transform: translateY(-300px);
    }

    .food-section.active .gravity-item {
      animation: gravityBounceDrop 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .food-section.active .gravity-item:nth-child(2) {
      animation-delay: 0.25s;
    }

    @keyframes gravityBounceDrop {
      0% {
        opacity: 0;
        transform: translateY(-300px);
      }
      60% {
        opacity: 1;
        transform: translateY(20px);
      }
      75% {
        transform: translateY(-10px);
      }
      90% {
        transform: translateY(4px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .plate-base {
      width: 180px;
      height: 35px;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0) 70%);
      border: 1px solid rgba(0, 240, 255, 0.15);
      border-radius: 50%;
      position: absolute;
      bottom: 0;
      z-index: 1;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), inset 0 0 10px rgba(0, 240, 255, 0.05);
    }

    .interactive-image-wrapper {
      width: 140px;
      height: 140px;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
    }

    .interactive-image-wrapper img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.5));
      transition: all 0.3s ease;
    }

    .interactive-image-wrapper.clickable:hover {
      transform: scale(1.08) translateY(-5px);
      cursor: pointer;
    }

    .interactive-image-wrapper.clickable:active {
      transform: scale(0.95);
    }

    .item-label {
      font-size: 0.95rem;
      font-weight: 600;
      color: #8892b0;
      z-index: 3;
      margin-top: 15px;
    }

    .refill-btn {
      margin-top: 15px;
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.25);
      color: var(--neon-blue);
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      z-index: 10;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.05);
      opacity: 0;
      pointer-events: none;
      transform: translateY(5px);
    }

    .refill-btn.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .refill-btn:hover {
      background: rgba(0, 240, 255, 0.2);
      box-shadow: var(--neon-blue-glow);
      transform: translateY(-2px);
    }

    .svg-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }

    .fallback-svg {
      width: 110px;
      height: 110px;
      filter: drop-shadow(0 5px 12px rgba(0, 240, 255, 0.2));
      transition: all 0.3s;
    }

    /* ==========================================
       11. SECTION 6: KİM BENİ NE KADAR TANIYOR? (QUIZ)
       ========================================== */
    .quiz-section {
      background: linear-gradient(180deg, rgba(2, 0, 12, 0.4) 0%, rgba(5, 11, 36, 0.3) 100%);
    }

    .quiz-container {
      max-width: 800px;
      width: 100%;
      text-align: center;
      background: rgba(2, 0, 16, 0.65);
      border: 1px solid rgba(0, 240, 255, 0.08);
      backdrop-filter: blur(15px);
      border-radius: 32px;
      padding: 4rem 3rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: perspective(1000px) rotateY(-180deg) rotateX(15deg) scale(0.85);
      transition: opacity 1.3s cubic-bezier(0.16, 1, 0.3, 1), transform 1.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .quiz-section.active .quiz-container {
      opacity: 1;
      transform: perspective(1000px) rotateY(0deg) rotateX(0deg) scale(1);
    }

    .quiz-card {
      margin-top: 2rem;
      transition: all 0.5s ease;
    }

    .question-text {
      font-size: 1.3rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 2rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      margin-bottom: 2rem;
    }

    @media (max-width: 600px) {
      .options-grid {
        grid-template-columns: 1fr;
        gap: 0.8rem;
      }
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #ccd6f6;
      padding: 1.1rem 1.5rem;
      border-radius: 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.2);
      text-align: left;
      position: relative;
      overflow: hidden;
    }

    .option-btn:hover {
      background: rgba(0, 240, 255, 0.05);
      border-color: rgba(0, 240, 255, 0.3);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 240, 255, 0.08);
    }

    .option-btn:active {
      transform: translateY(0);
    }

    .option-btn.correct {
      background: rgba(34, 197, 94, 0.15) !important;
      border-color: #22c55e !important;
      color: #4ade80 !important;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.3);
      pointer-events: none;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.15) !important;
      border-color: #ef4444 !important;
      color: #f87171 !important;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
    }

    .option-btn.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    /* Shake Animation */
    .shake {
      animation: buttonShake 0.4s ease-in-out;
    }

    @keyframes buttonShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
    }

    .feedback-msg {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 2rem;
      min-height: 24px;
      transition: all 0.3s;
    }

    .feedback-msg.correct-text {
      color: #4ade80;
      text-shadow: 0 0 10px rgba(74, 222, 128, 0.3);
    }

    .feedback-msg.wrong-text {
      color: #f87171;
      text-shadow: 0 0 10px rgba(248, 113, 113, 0.3);
    }

    .quiz-next-btn {
      background: linear-gradient(90deg, var(--neon-blue) 0%, #0077ff 100%);
      border: none;
      color: #ffffff;
      padding: 0.8rem 2.2rem;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: var(--neon-blue-glow);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .quiz-next-btn.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .quiz-next-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 240, 255, 0.5);
    }

    /* ==========================================
       12. SECTION 7: EN ÇOK KULLANDIKLARIMIZ (KELİME DÜNYASI)
       ========================================== */
    .words-section {
      background: linear-gradient(180deg, rgba(5, 11, 36, 0.3) 0%, rgba(2, 0, 12, 0.4) 100%);
    }

    .words-container {
      max-width: 1000px;
      width: 100%;
      text-align: center;
    }

    .words-header h2 {
      font-size: clamp(2rem, 5vw, 2.8rem);
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #ffffff 40%, var(--neon-blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .words-header p {
      color: #8892b0;
      font-size: 1.1rem;
      margin-bottom: 4rem;
    }

    .words-cloud {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
      max-width: 850px;
      margin: 0 auto;
      min-height: 250px;
      align-items: center;
    }

    .word-bubble {
      background: rgba(0, 240, 255, 0.02);
      border: 1px solid rgba(0, 240, 255, 0.15);
      color: #ffffff;
      padding: 1.2rem 2.4rem;
      border-radius: 16px;
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3), inset 0 0 10px rgba(0, 240, 255, 0.02);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      user-select: none;
    }

    .bubble-w1 { animation: floatWord1 6s infinite alternate ease-in-out; }
    .bubble-w2 { animation: floatWord2 5.5s infinite alternate ease-in-out; }
    .bubble-w3 { animation: floatWord3 7s infinite alternate ease-in-out; }
    .bubble-w4 { animation: floatWord4 6.5s infinite alternate ease-in-out; }
    .bubble-w5 { animation: floatWord5 5s infinite alternate ease-in-out; }
    .bubble-w6 { animation: floatWord6 7.5s infinite alternate ease-in-out; }
    .bubble-w7 { animation: floatWord7 6s infinite alternate ease-in-out; }

    @keyframes floatWord1 {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(12px, -15px) rotate(3deg); }
    }
    @keyframes floatWord2 {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(-15px, 10px) rotate(-4deg); }
    }
    @keyframes floatWord3 {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(8px, 15px) rotate(2deg); }
    }
    @keyframes floatWord4 {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(-10px, -12px) rotate(-3deg); }
    }
    @keyframes floatWord5 {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(15px, -8px) rotate(4deg); }
    }
    @keyframes floatWord6 {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(-8px, 14px) rotate(-2deg); }
    }
    @keyframes floatWord7 {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(10px, -10px) rotate(3deg); }
    }

    .word-bubble:hover, .word-bubble:active {
      background: rgba(0, 240, 255, 0.1);
      border-color: var(--neon-blue);
      box-shadow: var(--neon-blue-glow), inset 0 0 15px rgba(0, 240, 255, 0.1);
      color: #ffffff;
      transform: scale(1.15) rotate(0deg) !important;
      animation-play-state: paused;
    }

    /* ==========================================

    }

    .cinema-container {
      max-width: 1100px;
      width: 100%;
      text-align: center;
      opacity: 0;
      transform: scale(0.88);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .cinema-section.active .cinema-container {
      opacity: 1;
      transform: scale(1);
    }

    .cinema-header h2 {
      font-size: clamp(2rem, 5vw, 2.8rem);
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #ffffff 40%, var(--neon-blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .cinema-header p {
      color: #8892b0;
      font-size: 1.1rem;
      margin-bottom: 3.5rem;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.7;
    }

    .movies-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      margin-top: 1rem;
    }

    @media (max-width: 900px) {
      .movies-grid {
        grid-template-columns: 1fr;
        gap: 2rem;
        max-width: 450px;
        margin: 1rem auto 0 auto;
      }
    }

    .movie-card {
      background: rgba(2, 0, 16, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 2.5rem 1.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .movie-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.3), transparent);
      transition: background 0.3s;
    }

    .movie-poster-fallback {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid rgba(0, 240, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: var(--neon-blue);
      margin-bottom: 1.5rem;
      transition: all 0.3s;
    }

    .movie-info h3 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
      color: #ffffff;
    }

    .movie-info p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #8892b0;
      margin-bottom: 2rem;
      min-height: 72px;
    }

    .movie-select-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: var(--neon-blue);
      padding: 0.6rem 1.8rem;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
    }

    .movie-card.selected {
      border-color: var(--neon-blue);
      box-shadow: var(--neon-blue-glow);
      transform: translateY(-8px);
    }

    .movie-card.selected::before {
      background: var(--neon-blue);
      box-shadow: 0 0 10px var(--neon-blue);
    }

    .movie-card.selected .movie-poster-fallback {
      background: rgba(0, 240, 255, 0.15);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      transform: scale(1.1);
    }

    .movie-card.selected .movie-select-btn {
      background: var(--neon-blue);
      color: var(--bg-dark);
      box-shadow: 0 0 10px var(--neon-blue);
      border-color: var(--neon-blue);
    }
